name: Bug report
description: Report a reproducible problem in a published package, documentation, or validation check.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Repository validation
        - Documentation
        - Published skill package
        - Installation or compatibility evidence
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior without including private or sensitive data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal, synthetic reproduction and the repository commit tested.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant client and version details only when the report concerns compatibility.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safety confirmation
      options:
        - label: I removed credentials, private material, customer data, and sensitive transcripts.
          required: true
